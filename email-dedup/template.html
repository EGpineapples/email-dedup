<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Email Toolkit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
--bg:#0e1117;--surface:#161b22;--surface-2:#1c2333;--border:#2a3142;
--text:#e2e8f0;--text-dim:#8b95a5;--accent:#3d8bfd;--accent-soft:#3d8bfd18;
--green:#34d399;--green-soft:#34d39918;--amber:#fbbf24;--amber-soft:#fbbf2418;
--violet:#a78bfa;--violet-soft:#a78bfa18;--rose:#fb7185;--rose-soft:#fb718518;
--red:#f87171;--cyan:#22d3ee;--cyan-soft:#22d3ee18;
--radius:12px;
--font-ui:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,sans-serif;
--font-mono:'IBM Plex Mono','Menlo','Consolas',monospace;
}
body{font-family:var(--font-ui);background:var(--bg);color:var(--text);min-height:100vh;line-height:1.5;-webkit-font-smoothing:antialiased}
.app{max-width:1200px;margin:0 auto;padding:40px 20px 80px}
header{text-align:center;margin-bottom:32px}
header h1{font-size:30px;font-weight:700;letter-spacing:-.8px;margin-bottom:6px}
header h1 span{color:var(--accent)}
header p{color:var(--text-dim);font-size:14px}

/* ── Tabs ── */
.tabs{display:flex;gap:4px;margin-bottom:24px;border-bottom:1px solid var(--border);padding-bottom:0}
.tab-btn{background:none;border:none;color:var(--text-dim);font:500 14px var(--font-ui);padding:10px 18px;cursor:pointer;border-bottom:2px solid transparent;transition:.2s}
.tab-btn:hover{color:var(--text)}
.tab-btn.active{color:var(--accent);border-bottom-color:var(--accent)}
.tab-panel{display:none}
.tab-panel.active{display:block}

/* ── Sub-tabs (for Duplicate Checker) ── */
.sub-tabs{display:flex;gap:6px;margin-bottom:20px;flex-wrap:wrap}
.sub-tab{background:var(--surface);border:1px solid var(--border);color:var(--text-dim);font:500 13px var(--font-ui);
  padding:7px 16px;border-radius:20px;cursor:pointer;transition:.2s}
.sub-tab:hover{border-color:var(--accent);color:var(--text)}
.sub-tab.active{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.sub-panel{display:none}
.sub-panel.active{display:block}

/* ── Drop zones ── */
.drop-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px}
.drop-grid.single{grid-template-columns:1fr}
.drop{background:var(--surface);border:1.5px dashed var(--border);border-radius:var(--radius);padding:28px 16px;text-align:center;cursor:pointer;transition:.2s}
.drop:hover,.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop-icon{width:40px;height:40px;margin:0 auto 10px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;font-size:18px}
.drop-label{font-weight:600;font-size:14px;margin-bottom:4px}
.drop-hint{font-size:12px;color:var(--text-dim)}
.drop input[type=file]{display:none}
.file-list{margin-top:8px;font-size:12px;color:var(--green)}

/* ── Action button ── */
.btn{background:var(--accent);color:#fff;border:none;font:600 14px var(--font-ui);padding:10px 28px;border-radius:8px;cursor:pointer;transition:.15s}
.btn:hover{filter:brightness(1.15)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-row{display:flex;gap:12px;align-items:center;margin-bottom:24px}

/* ── Results ── */
.results{margin-top:24px}
.summary-bar{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 18px;min-width:130px;flex:1}
.stat .label{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--text-dim);margin-bottom:4px}
.stat .value{font-size:22px;font-weight:700;font-family:var(--font-mono)}
.stat.green .value{color:var(--green)}
.stat.amber .value{color:var(--amber)}
.stat.accent .value{color:var(--accent)}
.stat.rose .value{color:var(--rose)}

/* ── File report cards ── */
.file-report{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:12px}
.file-report h4{font-size:14px;font-weight:600;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.file-report .badge{font-size:10px;padding:2px 8px;border-radius:10px;font-weight:600;text-transform:uppercase}
.badge-new{background:var(--accent-soft);color:var(--accent)}
.badge-hist{background:var(--violet-soft);color:var(--violet)}
.file-meta{display:flex;gap:16px;font-size:13px;color:var(--text-dim);margin-bottom:8px;flex-wrap:wrap}
.file-meta span{display:flex;align-items:center;gap:4px}
.dupe-list{margin-top:8px}
.dupe-list summary{font-size:13px;font-weight:500;color:var(--amber);cursor:pointer}
.dupe-list ul{list-style:none;padding-left:12px;margin-top:6px}
.dupe-list li{font-size:12px;font-family:var(--font-mono);color:var(--text-dim);padding:2px 0}
.dupe-list li span.count{color:var(--amber);font-weight:600;margin-left:6px}
.no-dupes{font-size:13px;color:var(--green);margin-top:6px}

/* ── Email lists ── */
.email-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:16px}
.email-box-header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--border)}
.email-box-header h3{font-size:14px;font-weight:600}
.email-box-body{padding:12px 16px;max-height:260px;overflow-y:auto;font-family:var(--font-mono);font-size:12px;line-height:1.8;color:var(--text-dim)}
.copy-btn,.dl-btn{background:var(--surface-2);border:1px solid var(--border);color:var(--text-dim);font:500 12px var(--font-ui);padding:4px 12px;border-radius:6px;cursor:pointer;transition:.15s}
.copy-btn:hover,.dl-btn:hover{border-color:var(--accent);color:var(--text)}

/* ── Error display ── */
.error-msg{background:var(--rose-soft);border:1px solid var(--rose);color:var(--rose);padding:10px 16px;border-radius:8px;font-size:13px;margin-bottom:16px}
.info-msg{background:var(--accent-soft);border:1px solid var(--accent);color:var(--accent);padding:10px 16px;border-radius:8px;font-size:13px;margin-bottom:16px}

/* ── Password tab ── */
.pw-controls{display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap;margin-bottom:24px}
.pw-field label{display:block;font-size:12px;color:var(--text-dim);margin-bottom:4px;font-weight:500}
.pw-field input[type=number]{background:var(--surface);border:1px solid var(--border);color:var(--text);font:14px var(--font-mono);padding:8px 12px;border-radius:8px;width:80px}
.pw-field input[type=number]:focus{outline:none;border-color:var(--accent)}
.toggle{display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer}
.toggle input{accent-color:var(--accent);width:16px;height:16px}
.pw-list{font-family:var(--font-mono);font-size:13px;line-height:2;color:var(--text-dim)}

/* ── Orders tab (preserved from original) ── */
.orders-section{margin-bottom:32px}
.orders-section h3{font-size:16px;font-weight:600;margin-bottom:12px}
.tbl-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius);margin-bottom:16px}
table.data{width:100%;border-collapse:collapse;font-size:12px;white-space:nowrap}
table.data th{background:var(--surface-2);color:var(--text-dim);font-weight:600;text-transform:uppercase;font-size:10px;letter-spacing:.6px;padding:10px 12px;text-align:left;position:sticky;top:0}
table.data td{padding:8px 12px;border-top:1px solid var(--border);vertical-align:middle}
table.data input[type=number],table.data input[type=text],table.data input[type=date]{
  background:var(--surface);border:1px solid var(--border);color:var(--text);font:12px var(--font-mono);
  padding:4px 8px;border-radius:6px;width:80px}
table.data input:focus{outline:none;border-color:var(--accent)}
table.data .game-badge{font-size:9px;padding:2px 7px;border-radius:8px;font-weight:700;text-transform:uppercase;display:inline-block}
.g-mtg{background:#7c3aed22;color:#a78bfa}
.g-pokemon{background:#f59e0b22;color:#fbbf24}
.g-yugioh{background:#ef444422;color:#f87171}
.g-swu{background:#06b6d422;color:#22d3ee}
.g-onepiece{background:#ec489922;color:#f472b6}
.g-lorcana{background:#8b5cf622;color:#c4b5fd}
.g-other{background:#64748b22;color:#94a3b8}
.toggle-sm{appearance:none;width:36px;height:20px;border-radius:10px;background:var(--border);position:relative;cursor:pointer;transition:.2s;vertical-align:middle}
.toggle-sm:checked{background:var(--green)}
.toggle-sm::after{content:'';position:absolute;width:16px;height:16px;border-radius:50%;background:#fff;top:2px;left:2px;transition:.2s}
.toggle-sm:checked::after{left:18px}
.del-btn{background:none;border:1px solid var(--border);color:var(--red);font-size:14px;padding:2px 8px;border-radius:6px;cursor:pointer}
.del-btn:hover{background:var(--rose-soft);border-color:var(--red)}
.summary-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:16px}

/* ── Toast ── */
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--surface-2);border:1px solid var(--border);color:var(--text);font:500 13px var(--font-ui);padding:10px 24px;border-radius:8px;opacity:0;transition:.3s;pointer-events:none;z-index:999}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ── Scrollbar ── */
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

/* ── Responsive ── */
@media(max-width:640px){
  .drop-grid{grid-template-columns:1fr}
  .summary-bar{flex-direction:column}
  .pw-controls{flex-direction:column;align-items:stretch}
}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Email <span>Toolkit</span></h1>
    <p>Dedup · Passwords · Orders</p>
  </header>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('dedup')">Duplicate Checker</button>
    <button class="tab-btn" onclick="switchTab('passwords')">Passwords</button>
    <button class="tab-btn" onclick="switchTab('orders')">Orders</button>
  </div>

  <!-- ═══════════════════════════════════════════════════════════════════════ -->
  <!-- TAB 1: DUPLICATE CHECKER                                              -->
  <!-- ═══════════════════════════════════════════════════════════════════════ -->
  <div id="tab-dedup" class="tab-panel active">
    <div class="sub-tabs">
      <button class="sub-tab active" onclick="switchSub('email')">✉ Emails</button>
      <button class="sub-tab" onclick="switchSub('phone')">☎ Phone Numbers</button>
      <button class="sub-tab" onclick="switchSub('card')">💳 Card Numbers</button>
      <button class="sub-tab" onclick="switchSub('address')">📍 Addresses</button>
    </div>

    <!-- ── Email Sub-panel ── -->
    <div id="sub-email" class="sub-panel active">
      <div class="drop-grid">
        <label class="drop" id="drop-new" ondragover="ev(event)" ondragleave="lv(event)" ondrop="dp(event,'new-input')">
          <div class="drop-icon">📄</div>
          <div class="drop-label">New Batch</div>
          <div class="drop-hint">iCloud emails to check</div>
          <input type="file" id="new-input" accept=".txt,.csv" multiple onchange="showFiles(this,'list-new')">
          <div class="file-list" id="list-new"></div>
        </label>
        <label class="drop" id="drop-hist" ondragover="ev(event)" ondragleave="lv(event)" ondrop="dp(event,'hist-input')">
          <div class="drop-icon">📚</div>
          <div class="drop-label">History Files</div>
          <div class="drop-hint">Previously used emails</div>
          <input type="file" id="hist-input" accept=".txt,.csv" multiple onchange="showFiles(this,'list-hist')">
          <div class="file-list" id="list-hist"></div>
        </label>
      </div>
      <div class="btn-row">
        <button class="btn" id="btn-dedup" onclick="runDedup()">Check Duplicates</button>
      </div>
      <div id="email-results" class="results"></div>
    </div>

    <!-- ── Phone Sub-panel ── -->
    <div id="sub-phone" class="sub-panel">
      <div class="drop-grid single">
        <label class="drop" id="drop-phone" ondragover="ev(event)" ondragleave="lv(event)" ondrop="dp(event,'phone-input')">
          <div class="drop-icon">☎</div>
          <div class="drop-label">Phone Number Files</div>
          <div class="drop-hint">TXT or CSV — finds US phone patterns (10-digit)</div>
          <input type="file" id="phone-input" accept=".txt,.csv" multiple onchange="showFiles(this,'list-phone')">
          <div class="file-list" id="list-phone"></div>
        </label>
      </div>
      <div class="btn-row">
        <button class="btn" onclick="runPhoneCheck()">Find Duplicate Phones</button>
      </div>
      <div id="phone-results" class="results"></div>
    </div>

    <!-- ── Card Sub-panel ── -->
    <div id="sub-card" class="sub-panel">
      <div class="drop-grid single">
        <label class="drop" id="drop-card" ondragover="ev(event)" ondragleave="lv(event)" ondrop="dp(event,'card-input')">
          <div class="drop-icon">💳</div>
          <div class="drop-label">Card Info Files</div>
          <div class="drop-hint">Finds 13–19 digit card numbers (Luhn-validated)</div>
          <input type="file" id="card-input" accept=".txt,.csv" multiple onchange="showFiles(this,'list-card')">
          <div class="file-list" id="list-card"></div>
        </label>
      </div>
      <div class="btn-row">
        <button class="btn" onclick="runCardCheck()">Find Duplicate Cards</button>
      </div>
      <div id="card-results" class="results"></div>
    </div>

    <!-- ── Address Sub-panel ── -->
    <div id="sub-address" class="sub-panel">
      <div class="drop-grid single">
        <label class="drop" id="drop-addr" ondragover="ev(event)" ondragleave="lv(event)" ondrop="dp(event,'addr-input')">
          <div class="drop-icon">📍</div>
          <div class="drop-label">Address CSV Files</div>
          <div class="drop-hint">CSV with address columns — matches on Address Line 1 + Line 2</div>
          <input type="file" id="addr-input" accept=".csv" multiple onchange="showFiles(this,'list-addr')">
          <div class="file-list" id="list-addr"></div>
        </label>
      </div>
      <div class="btn-row">
        <button class="btn" onclick="runAddrCheck()">Find Duplicate Addresses</button>
      </div>
      <div id="addr-results" class="results"></div>
    </div>
  </div>

  <!-- ═══════════════════════════════════════════════════════════════════════ -->
  <!-- TAB 2: PASSWORDS                                                      -->
  <!-- ═══════════════════════════════════════════════════════════════════════ -->
  <div id="tab-passwords" class="tab-panel">
    <div class="pw-controls">
      <div class="pw-field"><label>Count</label><input type="number" id="pw-count" value="5" min="1" max="100"></div>
      <div class="pw-field"><label>Length</label><input type="number" id="pw-len" value="12" min="4" max="128"></div>
      <label class="toggle"><input type="checkbox" id="pw-sym"> Include symbols</label>
      <button class="btn" onclick="genPW()">Generate</button>
    </div>
    <div id="pw-out" class="pw-list"></div>
  </div>

  <!-- ═══════════════════════════════════════════════════════════════════════ -->
  <!-- TAB 3: ORDERS                                                         -->
  <!-- ═══════════════════════════════════════════════════════════════════════ -->
  <div id="tab-orders" class="tab-panel">
    <!-- Presale upload -->
    <div class="orders-section">
      <h3>TCGplayer Presales</h3>
      <div class="drop-grid">
        <label class="drop" ondragover="ev(event)" ondragleave="lv(event)" ondrop="dp(event,'ps-input')">
          <div class="drop-icon">📋</div>
          <div class="drop-label">Pull Sheet CSV</div>
          <input type="file" id="ps-input" accept=".csv" onchange="showFiles(this,'list-ps')">
          <div class="file-list" id="list-ps"></div>
        </label>
        <label class="drop" ondragover="ev(event)" ondragleave="lv(event)" ondrop="dp(event,'se-input')">
          <div class="drop-icon">📦</div>
          <div class="drop-label">Shipping Export CSV</div>
          <input type="file" id="se-input" accept=".csv" onchange="showFiles(this,'list-se')">
          <div class="file-list" id="list-se"></div>
        </label>
      </div>
      <div class="btn-row">
        <button class="btn" onclick="runOrders()">Process Presales</button>
      </div>
      <div id="presale-results"></div>
    </div>
    <!-- Order tracker upload -->
    <div class="orders-section">
      <h3>Order Tracker (Sourcing)</h3>
      <div class="drop-grid single">
        <label class="drop" ondragover="ev(event)" ondragleave="lv(event)" ondrop="dp(event,'trk-input')">
          <div class="drop-icon">📬</div>
          <div class="drop-label">Order Tracker CSV</div>
          <input type="file" id="trk-input" accept=".csv" onchange="showFiles(this,'list-trk')">
          <div class="file-list" id="list-trk"></div>
        </label>
      </div>
      <div class="btn-row">
        <button class="btn" onclick="runTracker()">Process Tracker</button>
      </div>
      <div id="tracker-results"></div>
    </div>
    <!-- Summary cards -->
    <div id="order-summary"></div>
  </div>

</div>
<div id="toast"></div>

<script>
const $=id=>document.getElementById(id);

/* ── Tab switching ── */
function switchTab(name){
  document.querySelectorAll('.tab-btn').forEach((b,i)=>{
    const panels=['dedup','passwords','orders'];
    const active=panels[i]===name;
    b.classList.toggle('active',active);
    $(('tab-'+panels[i])).classList.toggle('active',active);
  });
}
function switchSub(name){
  document.querySelectorAll('.sub-tab').forEach(b=>{
    b.classList.toggle('active',b.textContent.toLowerCase().includes(name));
  });
  document.querySelectorAll('.sub-panel').forEach(p=>{
    p.classList.toggle('active',p.id==='sub-'+name);
  });
}

/* ── Drag & drop ── */
function ev(e){e.preventDefault();e.currentTarget.classList.add('over')}
function lv(e){e.currentTarget.classList.remove('over')}
function dp(e,inputId){
  e.preventDefault();e.currentTarget.classList.remove('over');
  const inp=$(inputId);
  inp.files=e.dataTransfer.files;
  const listId=inp.getAttribute('onchange').match(/'([^']+)'/)?.[1];
  if(listId)showFiles(inp,listId);
}
function showFiles(inp,listId){
  const el=$(listId);
  el.innerHTML=[...inp.files].map(f=>`✓ ${f.name}`).join('<br>');
}

/* ── Email Dedup ── */
async function runDedup(){
  const fd=new FormData();
  const nf=$('new-input').files;
  const hf=$('hist-input').files;
  if(!nf.length){toast('Upload at least one new-batch file');return}
  for(const f of nf) fd.append('new_batch',f);
  for(const f of hf) fd.append('history_files',f);

  $('btn-dedup').disabled=true;
  $('btn-dedup').textContent='Processing…';
  try{
    const r=await fetch('/process',{method:'POST',body:fd});
    const d=await r.json();
    if(d.error){$('email-results').innerHTML=`<div class="error-msg">${d.error}</div>`;return}
    renderEmailResults(d);
  }catch(e){$('email-results').innerHTML=`<div class="error-msg">${e.message}</div>`}
  finally{$('btn-dedup').disabled=false;$('btn-dedup').textContent='Check Duplicates'}
}

function renderEmailResults(d){
  let html='';

  // Summary stats
  html+=`<div class="summary-bar">
    <div class="stat accent"><div class="label">New Batch</div><div class="value">${d.new_size}</div></div>
    <div class="stat"><div class="label">Master Set</div><div class="value">${d.master_size}</div></div>
    <div class="stat amber"><div class="label">Used (Dupes)</div><div class="value">${d.used.length}</div></div>
    <div class="stat green"><div class="label">Unused (New)</div><div class="value">${d.unused.length}</div></div>
  </div>`;

  // Per-file reports
  if(d.file_reports&&d.file_reports.length){
    html+='<h3 style="font-size:15px;font-weight:600;margin-bottom:12px">Per-File Analysis</h3>';
    for(const fr of d.file_reports){
      const isNew=fr.role==='new_batch';
      const badge=isNew?'<span class="badge badge-new">New Batch</span>':'<span class="badge badge-hist">History</span>';
      const dupeCount=Object.keys(fr.internal_dupes).length;
      html+=`<div class="file-report">
        <h4>${badge} ${esc(fr.filename)}</h4>
        <div class="file-meta">
          <span>📝 ${fr.total_lines} total lines</span>
          <span>📧 ${fr.emails_found} unique emails</span>
          <span>🔍 ${fr.total_matches} total matches</span>
        </div>`;
      if(dupeCount>0){
        html+=`<details class="dupe-list"><summary>⚠ ${dupeCount} email${dupeCount>1?'s':''} duplicated within this file</summary><ul>`;
        for(const [email,cnt] of Object.entries(fr.internal_dupes)){
          html+=`<li>${esc(email)} <span class="count">×${cnt}</span></li>`;
        }
        html+='</ul></details>';
      }else{
        html+='<div class="no-dupes">✓ No internal duplicates</div>';
      }
      html+='</div>';
    }
  }

  // Used emails
  if(d.used.length){
    html+=`<div class="email-box"><div class="email-box-header"><h3 style="color:var(--amber)">Used Emails (${d.used.length})</h3>
      <div style="display:flex;gap:6px">
        <button class="copy-btn" onclick="copyList('used-list')">Copy</button>
        <a class="dl-btn" href="/download/used?data=${encodeURIComponent(d.used.join('\\n'))}" download>↓</a>
      </div></div>
      <div class="email-box-body" id="used-list">${d.used.join('<br>')}</div></div>`;
  }
  // Unused emails
  if(d.unused.length){
    html+=`<div class="email-box"><div class="email-box-header"><h3 style="color:var(--green)">Unused Emails (${d.unused.length})</h3>
      <div style="display:flex;gap:6px">
        <button class="copy-btn" onclick="copyList('unused-list')">Copy</button>
        <a class="dl-btn" href="/download/unused?data=${encodeURIComponent(d.unused.join('\\n'))}" download>↓</a>
      </div></div>
      <div class="email-box-body" id="unused-list">${d.unused.join('<br>')}</div></div>`;
  }

  $('email-results').innerHTML=html;
}

function renderGenericResults(targetId,d,type,label){
  let html='';
  html+=`<div class="summary-bar">
    <div class="stat accent"><div class="label">Total Found</div><div class="value">${d.total_found}</div></div>
    <div class="stat green"><div class="label">Unique</div><div class="value">${d.total_unique}</div></div>
  </div>`;

  for(const rpt of d.reports){
    const dupeCount=Object.keys(rpt.internal_dupes).length;
    const foundKey=type==='phone'?'phones_found':'cards_found';
    html+=`<div class="file-report">
      <h4>${esc(rpt.filename)}</h4>
      <div class="file-meta">
        <span>📝 ${rpt.total_lines} total lines</span>
        <span>🔍 ${rpt[foundKey]} unique ${label.toLowerCase()}</span>
        <span>📊 ${rpt.total_matches} total matches</span>
      </div>`;
    if(dupeCount>0){
      html+=`<details class="dupe-list"><summary>⚠ ${dupeCount} duplicate${dupeCount>1?'s':''} within this file</summary><ul>`;
      for(const [val,cnt] of Object.entries(rpt.internal_dupes)){
        html+=`<li>${esc(val)} <span class="count">×${cnt}</span></li>`;
      }
      html+='</ul></details>';
    }else{
      html+='<div class="no-dupes">✓ No internal duplicates</div>';
    }
    html+='</div>';
  }

  if(d.cross_file_dupes&&Object.keys(d.cross_file_dupes).length>0){
    html+='<div class="file-report" style="border-color:var(--amber)">';
    html+=`<h4 style="color:var(--amber)">⚠ Cross-File Duplicates</h4><ul style="list-style:none;padding:0">`;
    for(const [val,cnt] of Object.entries(d.cross_file_dupes)){
      html+=`<li style="font-family:var(--font-mono);font-size:12px;padding:2px 0;color:var(--text-dim)">${esc(val)} <span style="color:var(--amber);font-weight:600">×${cnt}</span></li>`;
    }
    html+='</ul></div>';
  }

  $(targetId).innerHTML=html;
}

function renderAddrResults(d){
  let html='';
  for(const rpt of d.reports){
    html+=`<div class="file-report"><h4>${esc(rpt.filename)}</h4>`;
    html+=`<div class="file-meta"><span>📝 ${rpt.total_lines} total lines</span>`;
    if(rpt.error){
      html+=`</div><div class="error-msg" style="margin-top:8px">${esc(rpt.error)}</div>`;
      if(rpt.columns_found){
        html+=`<div style="font-size:12px;color:var(--text-dim);margin-top:6px">Columns found: ${rpt.columns_found.map(c=>esc(c)).join(', ')}</div>`;
      }
    }else{
      html+=`<span>🏠 ${rpt.addresses_found} unique addresses across ${rpt.total_rows} rows</span>`;
      if(rpt.addr1_col) html+=`<span>Col 1: <b>${esc(rpt.addr1_col)}</b></span>`;
      if(rpt.addr2_col) html+=`<span>Col 2: <b>${esc(rpt.addr2_col)}</b></span>`;
      html+='</div>';
      const dupeCount=Object.keys(rpt.internal_dupes).length;
      if(dupeCount>0){
        html+=`<details class="dupe-list" open><summary>⚠ ${dupeCount} duplicate address${dupeCount>1?'es':''}</summary><ul>`;
        for(const [addr,cnt] of Object.entries(rpt.internal_dupes)){
          html+=`<li>${esc(addr)} <span class="count">×${cnt}</span></li>`;
        }
        html+='</ul></details>';
      }else{
        html+='<div class="no-dupes">✓ No duplicate addresses</div>';
      }
    }
    html+='</div>';
  }
  $('addr-results').innerHTML=html;
}

/* ── Orders (simplified — preserving core logic) ── */
async function runOrders(){
  const fd=new FormData();
  const ps=$('ps-input').files[0], se=$('se-input').files[0];
  if(!ps||!se){toast('Upload both CSVs');return}
  fd.append('pull_sheet',ps);fd.append('shipping_export',se);
  try{
    const r=await fetch('/process-orders',{method:'POST',body:fd});
    const d=await r.json();
    if(d.error){$('presale-results').innerHTML=`<div class="error-msg">${d.error}</div>`;return}
    renderPresaleTable(d.products);
  }catch(e){$('presale-results').innerHTML=`<div class="error-msg">${e.message}</div>`}
}

function gameClass(g){return'g-'+(g||'other').toLowerCase().replace(/[^a-z]/g,'')}

function renderPresaleTable(products){
  let html=`<div class="tbl-wrap"><table class="data"><thead><tr>
    <th>Game</th><th>Product</th><th>Set</th><th>Qty</th><th>Orders</th><th>Revenue</th><th>Release</th>
    <th>COGS/u</th><th>Paid?</th><th>Hold</th><th>Open</th><th>At Cost</th><th>Exp Rev</th><th>Fee%</th><th>Profit</th>
  </tr></thead><tbody>`;
  products.forEach((p,i)=>{
    html+=`<tr data-idx="${i}">
      <td><span class="game-badge ${gameClass(p.game)}">${p.game}</span></td>
      <td>${esc(p.name)}</td><td>${esc(p.set)}</td><td>${p.qty}</td><td>${p.orders}</td>
      <td>$${p.revenue.toFixed(2)}</td>
      <td><input type="date" value="${p.release_date||''}" class="ps-date"></td>
      <td><input type="number" class="ps-cogs" value="0" min="0" step="0.01"></td>
      <td><input type="checkbox" class="toggle-sm ps-paid"></td>
      <td><input type="number" class="ps-hold" value="0" min="0" style="width:50px"></td>
      <td><input type="number" class="ps-open" value="${p.qty}" min="0" style="width:50px"></td>
      <td><input type="number" class="ps-atcost" value="0" min="0" style="width:50px"></td>
      <td><input type="number" class="ps-exprev" value="${p.revenue.toFixed(2)}" min="0" step="0.01"></td>
      <td><input type="number" class="ps-fee" value="13" min="0" max="100" step="0.5" style="width:55px"></td>
      <td class="ps-profit" style="font-family:var(--font-mono);font-weight:600">—</td>
    </tr>`;
  });
  html+='</tbody></table></div>';
  $('presale-results').innerHTML=html;

  // Attach listeners for live profit calc
  document.querySelectorAll('#presale-results input').forEach(inp=>{
    inp.addEventListener('input',()=>calcPresaleProfit(inp.closest('tr')));
  });
}

function calcPresaleProfit(row){
  const cogs=+(row.querySelector('.ps-cogs')?.value||0);
  const qty=+(row.cells[3]?.textContent||0);
  const expRev=+(row.querySelector('.ps-exprev')?.value||0);
  const fee=+(row.querySelector('.ps-fee')?.value||13)/100;
  const profit=(expRev*(1-fee))-(cogs*qty);
  const cell=row.querySelector('.ps-profit');
  cell.textContent='$'+profit.toFixed(2);
  cell.style.color=profit>=0?'var(--green)':'var(--red)';
}

async function runTracker(){
  const fd=new FormData();
  const f=$('trk-input').files[0];
  if(!f){toast('Upload a tracker CSV');return}
  fd.append('order_tracker',f);
  try{
    const r=await fetch('/process-order-tracker',{method:'POST',body:fd});
    const d=await r.json();
    if(d.error){$('tracker-results').innerHTML=`<div class="error-msg">${d.error}</div>`;return}
    renderTrackerTable(d.groups);
  }catch(e){$('tracker-results').innerHTML=`<div class="error-msg">${e.message}</div>`}
}

function renderTrackerTable(groups){
  let html=`<div class="tbl-wrap"><table class="data" id="trkTable"><thead><tr>
    <th>Game</th><th>Item</th><th>Retailer</th><th>Qty</th><th>Total</th><th>Order#</th><th>Date</th><th>Status</th>
    <th>In Presold?</th><th></th>
  </tr></thead><tbody id="trkBody">`;
  groups.forEach((g,i)=>{
    html+=`<tr data-tidx="${i}">
      <td><span class="game-badge ${gameClass(g.game)}">${g.game}</span></td>
      <td contenteditable="true">${esc(g.name)}</td>
      <td>${esc(g.retailer)}</td><td>${g.qty}</td><td>$${g.total.toFixed(2)}</td>
      <td>${esc(g.order_num)}</td><td>${esc(g.date)}</td><td>${esc(g.status)}</td>
      <td><input type="checkbox" class="toggle-sm presold-tog"></td>
      <td><button class="del-btn" onclick="this.closest('tr').remove()">✕</button></td>
    </tr>`;
  });
  html+='</tbody></table></div>';
  $('tracker-results').innerHTML=html;
}

/* ── Utils ── */
function copyList(id){
  const el=$(id);
  if(!el)return;
  navigator.clipboard.writeText(el.innerText).then(()=>toast('Copied to clipboard'));
}
function esc(s){
  if(!s)return'';
  const d=document.createElement('div');d.textContent=s;return d.innerHTML;
}
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2400)}
